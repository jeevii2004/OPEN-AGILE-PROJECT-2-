name: CI/CD Pipeline

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: read
  issues: write

jobs:
  backup-job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run backup script
        run: |
          chmod +x scripts/backup.sh
          ./scripts/backup.sh

      - name: Check backup
        run: |
          test -f backup/hello.sh
          echo "Backup verification successful!"

       - name: Generate automated report
        if: always()
        run: |
          chmod +x scripts/generate_report.sh
          ./scripts/generate_report.sh

      - name: Report SUCCESS to Issue #5
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 5,
              body: '✅ **CI/CD SUCCESS**\n\nThe automated backup task completed successfully.\n\n**Action:** Backup verified. Task is ready to be marked as Done.'
            })

      - name: Close Issue #5 after successful backup
        if: success()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 5,
              state: 'closed'
            })

      - name: Report FAILURE to Issue #5
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 5,
              body: '❌ **CI/CD FAILURE**\n\nThe automated backup task failed.\n\n**Action:** Check the GitHub Actions logs, identify the error, and fix the backup script.'
            })
